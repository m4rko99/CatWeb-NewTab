<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main>
  <img class="logo" id="logo" src="logo.svg" alt="" draggable="false">

  <form class="search" id="searchForm" autocomplete="off">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="text" placeholder="Search or type a URL" spellcheck="false" autofocus>
  </form>

  <div class="shortcuts" id="shortcuts"></div>
</main>

<button type="button" class="theme-btn" id="themeBtn" aria-label="Theme" title="Theme">
  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.4c2.2 0 4-1.8 4-4 0-4.4-4.5-7.5-9.4-7.5zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
</button>
<div class="theme-panel" id="themePanel" hidden>
  <h3>Theme</h3>
  <div class="swatches" id="swatches"></div>
</div>

<div class="backdrop" id="pickerBackdrop">
  <div class="picker" id="picker">
    <div class="picker-head">
      <h2>Color Picker</h2>
      <div class="picker-ctl">
        <div class="mode" role="group" aria-label="Light or dark">
          <button type="button" id="modeDark" class="on" title="Dark version" aria-label="Dark version"><svg viewBox="0 0 24 24"><path d="M12.4 3a9 9 0 1 0 8.6 11.6A7 7 0 0 1 12.4 3z"/></svg></button>
          <button type="button" id="modeLight" title="Light version" aria-label="Light version"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM5.6 19.8l-1.4-1.4 2.1-2.1 1.4 1.4zM19.8 5.6l-1.4-1.4-2.1 2.1 1.4 1.4z"/></svg></button>
        </div>
        <button type="button" class="x" id="pickerClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
      </div>
    </div>
    <div class="picker-body">
      <div class="preview" id="pPreview"></div>
      <div class="sv" id="pSV"><div class="knob" id="svKnob"></div></div>
    </div>
    <div class="hue" id="pHue"><div class="knob" id="hueKnob"></div></div>
    <div class="picker-foot"><button type="button" class="btn" id="pickerDone">Done</button></div>
  </div>
</div>

<div class="backdrop" id="backdrop">
  <form class="modal" id="modal" autocomplete="off">
    <h2 id="modalTitle">Add shortcut</h2>
    <div class="switch" id="modeSwitch" role="tablist" aria-label="Shortcut type">
      <button type="button" role="tab" class="on" data-mode="url" aria-selected="true">Website</button>
      <button type="button" role="tab" data-mode="catweb" aria-selected="false">CatWeb site</button>
    </div>
    <label for="scName">Name</label>
    <div class="field"><input id="scName" type="text" spellcheck="false"></div>
    <label for="scUrl" id="urlLabel">URL</label>
    <div class="field">
      <input id="scUrl" type="text" spellcheck="false">
    </div>
    <button type="button" class="btn restore" id="restoreBtn">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Restore default shortcuts
    </button>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Done</button>
    </div>
  </form>
</div>

<script src="newtab.js"></script>
</body>
</html>
